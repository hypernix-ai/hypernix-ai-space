# Updates the Hugging Face organization card, and the full page it links to.
#
#   Hyprnyx/README       the org card shown on https://huggingface.co/Hyprnyx.
#                        Hugging Face builds the card from this Space's
#                        README.md, so it gets README.md and assets/ only:
#                        an index.html here would replace the card with an
#                        unstyled copy of the page. The Space is kept public,
#                        because a private one hides the card.
#   Hyprnyx/Hyprnyx      the full page: everything in site/.
#
# Runs on every push to main/master, and from the Actions tab, where you can
# choose to update only the card or only the page.
#
# Needs one repository secret:
#   HF_TOKEN  a Hugging Face write token that can create and write repos in
#             the Hyprnyx org on Hugging Face.
# Optional repository variables:
#   HF_SPACE       the card Space      (default: Hyprnyx/README)
#   HF_SITE_SPACE  the full-page Space (default: Hyprnyx/Hyprnyx)

name: Deploy Space

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: "What to update"
        type: choice
        options: [card and page, card only, page only]
        default: card and page

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || 'Hyprnyx/README' }}
      HF_SITE_SPACE: ${{ vars.HF_SITE_SPACE || 'Hyprnyx/Hyprnyx' }}
      TARGET: ${{ inputs.target || 'card and page' }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the token is set
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add a Hugging Face write token as the HF_TOKEN repository secret."
            exit 1
          fi

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.30,<3"

      - name: Update the organization card and page
        shell: python
        run: |
          import os, re, shutil, sys, tempfile
          from huggingface_hub import HfApi
          from huggingface_hub.errors import HfHubHTTPError, RepositoryNotFoundError

          api = HfApi(token=os.environ["HF_TOKEN"])
          target = os.environ["TARGET"]
          card_space = os.environ["HF_SPACE"]
          site_space = os.environ["HF_SITE_SPACE"]
          org = card_space.split("/")[0]
          ref = f"{os.environ.get('GITHUB_REPOSITORY', '')}@{os.environ.get('GITHUB_SHA', '')[:7]}"
          # Remove files deleted here (and, on the card, a stray index.html),
          # but never a Space's own .gitattributes.
          managed = ["*.html", "*.md", "*.css", "*.js", "assets/**"]
          summary = []

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          # Say whose token this is and what it may do in the org, so a
          # permissions failure names its own fix.
          me = api.whoami()
          token_role = (me.get("auth") or {}).get("accessToken", {}).get("role", "unknown")
          org_roles = {o.get("name"): o.get("roleInOrg") for o in me.get("orgs", [])}
          print(f"Token: user {me.get('name')}, {token_role} token, role in {org}: {org_roles.get(org, 'not a member')}")
          if token_role == "read":
              fail("HF_TOKEN is a read token. Create a write token (or a fine-grained one with write access to the org's repos).")
          if org not in org_roles:
              fail(f"HF_TOKEN belongs to {me.get('name')}, who is not a member of {org} "
                   f"(member of: {', '.join(sorted(org_roles)) or 'no organizations'}). "
                   f"Use a token from a {org} member, or add {me.get('name')} to {org}.")

          def ensure_space(space):
              # Creating needs more rights than writing: only create when missing.
              try:
                  api.repo_info(space, repo_type="space")
                  return
              except RepositoryNotFoundError:
                  pass
              try:
                  api.create_repo(space, repo_type="space", space_sdk="static", private=False, exist_ok=True)
                  print(f"{space}: created")
              except HfHubHTTPError as e:
                  if e.response is not None and e.response.status_code == 403:
                      fail(f"{space} does not exist and this token may not create Spaces in {org} "
                           f"(role: {org_roles.get(org)}). Either create the Space once by hand "
                           f"(static SDK, public) at https://huggingface.co/new-space?owner={org}, "
                           f"or use a token from a member with the write or admin role; a fine-grained "
                           f"token also needs 'Write access to contents/settings of all repos' for {org}.")
                  raise

          def deploy(space, folder, allow):
              ensure_space(space)
              try:
                  info = api.upload_folder(
                      repo_id=space,
                      repo_type="space",
                      folder_path=folder,
                      allow_patterns=allow,
                      delete_patterns=managed,
                      commit_message=f"Deploy from GitHub {ref}",
                  )
              except HfHubHTTPError as e:
                  if e.response is not None and e.response.status_code == 403:
                      fail(f"This token may not write to {space} (role in {org}: {org_roles.get(org)}). "
                           f"It needs the write or admin role, or fine-grained write access to {org}'s repos.")
                  raise
              print(f"{space}: {info.commit_url}")
              return info.commit_url

          if target in ("card and page", "card only"):
              # The README points its banner at a pinned GitHub URL so it can
              # also be pasted into the card editor by hand. Here the banner
              # is uploaded beside it, so point it at that copy instead: the
              # card then always shows the banner from this commit.
              with tempfile.TemporaryDirectory() as tmp:
                  shutil.copytree("assets", os.path.join(tmp, "assets"))
                  text = open("README.md", encoding="utf-8").read()
                  text = re.sub(r"https://raw\.githubusercontent\.com/[^\"')\s]+?/assets/", "assets/", text)
                  open(os.path.join(tmp, "README.md"), "w", encoding="utf-8").write(text)
                  url = deploy(card_space, tmp, ["README.md", "assets/**"])

              # A private or protected README Space hides the card.
              if api.repo_info(card_space, repo_type="space").private:
                  try:
                      api.update_repo_settings(card_space, repo_type="space", private=False)
                      print(f"{card_space}: made public so the card shows")
                  except HfHubHTTPError:
                      print(f"::warning::{card_space} is private, which hides the card, and this token "
                            f"may not change that. Make it public in the Space's settings.")

              files = set(api.list_repo_files(card_space, repo_type="space"))
              if "README.md" not in files or any(f.endswith(".html") for f in files):
                  print(f"::error::{card_space} should hold README.md and no HTML; it has: {sorted(files)}")
                  sys.exit(1)
              summary.append(f"- Organization card: https://huggingface.co/{org} ([commit]({url}))\n")

          if target in ("card and page", "page only"):
              url = deploy(site_space, "site", ["*.html", "README.md", "assets/**"])
              summary.append(f"- Full page: https://huggingface.co/spaces/{site_space} ([commit]({url}))\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("Updated:\n\n" + "".join(summary))
