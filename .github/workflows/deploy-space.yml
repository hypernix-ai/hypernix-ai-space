# Creates the two Hugging Face Spaces if they do not exist yet, then uploads
# to them:
#
#   hypernix-ai/README   the org card: README.md and assets/ from the repo
#                        root. Nothing else goes here, because the org page
#                        renders whatever this Space holds with styles and
#                        scripts stripped -- an index.html in it turns the
#                        card into an unstyled copy of the page.
#   hypernix-ai/Hyprnyx  the full page: everything in site/.
#
# Needs one repository secret:
#   HF_TOKEN  a Hugging Face write token that can create and write repos in
#             the hypernix-ai org.
# Optional repository variables:
#   HF_SPACE       the card Space      (default: hypernix-ai/README)
#   HF_SITE_SPACE  the full-page Space (default: hypernix-ai/Hyprnyx)

name: Deploy Space

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || 'hypernix-ai/README' }}
      HF_SITE_SPACE: ${{ vars.HF_SITE_SPACE || 'hypernix-ai/Hyprnyx' }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the token is set
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add a Hugging Face write token as the HF_TOKEN repository secret."
            exit 1
          fi

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.34,<3"

      - name: Create or update the Spaces
        shell: python
        run: |
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          ref = f"{os.environ.get('GITHUB_REPOSITORY', '')}@{os.environ.get('GITHUB_SHA', '')[:7]}"
          # Remove files deleted here (and, on the card, a stray index.html),
          # but never a Space's own .gitattributes.
          managed = ["*.html", "*.md", "*.css", "*.js", "assets/**"]

          def deploy(space, folder, allow):
              api.create_repo(space, repo_type="space", space_sdk="static", exist_ok=True)
              info = api.upload_folder(
                  repo_id=space,
                  repo_type="space",
                  folder_path=folder,
                  allow_patterns=allow,
                  delete_patterns=managed,
                  commit_message=f"Deploy from GitHub {ref}",
              )
              print(f"{space}: {info.commit_url}")
              return f"- [{space}](https://huggingface.co/spaces/{space}) · [commit]({info.commit_url})\n"

          lines = [
              deploy(os.environ["HF_SPACE"], ".", ["README.md", "assets/**"]),
              deploy(os.environ["HF_SITE_SPACE"], "site", ["*.html", "README.md", "assets/**"]),
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Deployed:\n\n" + "".join(lines))
